name: paperbot

on:
  schedule:
    # GitHub startet geplante Laeufe oft Stunden zu spaet. Deshalb mehrere fruehe Starts;
    # "paperbot.py auto" wartet selbst bis zur richtigen NY-Zeit und laeuft pro Tag nur einmal.
    - cron: "7 8,9,10,11,12 * * 1-5"    # Einstiege (9:30-11:05 NY)
    - cron: "7 15,16,17,18,19 * * 1-5"  # Glattstellen (15:45 NY)
  workflow_dispatch:
    inputs:
      cmd:
        description: "status | flat | run | auto"
        default: "status"

permissions:
  contents: write

concurrency:
  group: paperbot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.cmd }}" != "auto" ]; then
            python paperbot.py ${{ inputs.cmd }}
          else
            python paperbot.py auto
          fi
      - name: Status
        run: python paperbot.py status
      - name: Kontostand speichern
        if: always()
        run: |
          git config user.name "paperbot"
          git config user.email "paperbot@users.noreply.github.com"
          git add paperbot_state.json
          git diff --cached --quiet || (git commit -m "paperbot: Stand $(date -u +%F)" && git pull --rebase && git push)
